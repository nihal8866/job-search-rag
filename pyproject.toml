[build-system]
requires = ["setuptools>=65", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "job-search-rag"
version = "0.1.0"
description = "Multilingual hybrid job retrieval with cross-encoder reranking"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.3.3",
    "openpyxl==3.1.5",
    "beautifulsoup4==4.15.0",
    "torch==2.11.0+cu128",
    "transformers==5.20.2",
    "sentence-transformers==6.2.0",
    "chromadb==1.5.9",
    "rank-bm25==0.2.2",
]

[project.scripts]
job-rag = "job_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
